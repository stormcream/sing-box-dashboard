name: Release

on:
  push:
    branches: [my-stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm build
      - name: Package dist as zip
        run: |
          cd dist
          zip -qr ../sing-box-dashboard.zip .
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "sing-box-dashboard latest build" \
              --notes ""
          fi
          gh release upload latest sing-box-dashboard.zip --clobber
          gh release edit latest \
            --title "sing-box-dashboard latest build" \
            --notes "Built from [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on \`${GITHUB_REF_NAME}\`."
